name: update-gyeongmae

# ★ 자동 스케줄 해제됨.
#    courtauction.go.kr은 해외 IP(=GitHub Actions 러너)에서 접속이 차단되어
#    돌리면 전부 timeout → 0건으로 끝난다. 경매 수집은 한국 IP인 VPS에서만 가능.
#    아래 workflow_dispatch만 남겨 수동 실행/테스트용으로 유지한다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install
        run: pip install requests

      - name: crawl courtauction
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_gyeongmae.py 2>&1 | tee crawl_gyeongmae.log

      - name: commit data
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data_gyeongmae.js geocode_cache.json deal_cache.json || true
          git commit -m "update gyeongmae $(date +%F)" || echo "no changes"
          git push || echo "push skipped"
